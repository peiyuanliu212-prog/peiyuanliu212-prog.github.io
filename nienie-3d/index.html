<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>捏捏 3D 手感原型 v0.4 · 脆皮</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f3efe9; color: #2e2a26; }
  #scene { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: 14px 16px 8px; text-align: center; pointer-events: none; }
  header h1 { font-size: 19px; font-weight: 700; letter-spacing: .04em; }
  header p { font-size: 12.5px; color: #8a8178; margin-top: 3px; }
  #meters { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none; }
  .meter { background: rgba(255,255,255,.82); border: 1px solid #e3ddd2; border-radius: 999px; padding: 5px 12px; font-size: 12px; color: #6d6459; white-space: nowrap; }
  .meter b { color: #2e2a26; font-variant-numeric: tabular-nums; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.9); backdrop-filter: blur(10px); border-top: 1px solid #e3ddd2; }
  .row { display: flex; align-items: center; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .row:first-child { margin-top: 0; }
  .label { font-size: 12px; color: #8a8178; width: 34px; text-align: right; flex: none; }
  button { font: inherit; font-size: 13.5px; border: 1px solid #ddd5c7; background: #fff; color: #2e2a26; border-radius: 999px; padding: 8px 15px; cursor: pointer; transition: all .15s; }
  button:active { transform: scale(.96); }
  button.on { background: #2e2a26; color: #fff; border-color: #2e2a26; }
  button.primary { background: #e4572e; border-color: #e4572e; color: #fff; font-weight: 600; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; padding: 0; border: 2px solid rgba(0,0,0,.08); }
  .swatch.on { border-color: #2e2a26; transform: scale(1.12); }
  #toast { position: fixed; top: 118px; left: 50%; transform: translateX(-50%) translateY(-6px); background: #2e2a26; color: #fff; font-size: 13px; padding: 8px 16px; border-radius: 999px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 5; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="scene"></div>
<header>
  <h1>捏捏 · 脆皮原型 v0.4</h1>
  <p>按住压——裂纹会从指尖爬开，咔嚓作响；裂过的地方会变软、塌下去</p>
</header>
<div id="meters">
  <div class="meter">按压 <b id="mDepth">0%</b></div>
  <div class="meter">裂纹 <b id="mCrack">0 条</b></div>
</div>
<div id="toast"></div>

<div id="panel">
  <div class="row">
    <span class="label">造型</span>
    <button data-shape="block" class="on">方块 · 半透</button>
    <button data-shape="ball">圆球</button>
    <span class="label">颜色</span>
    <button class="swatch on" data-color="0xf6f1e7" style="background:#f6f1e7" aria-label="奶白"></button>
    <button class="swatch" data-color="0xf6cdd9" style="background:#f6cdd9" aria-label="粉"></button>
    <button class="swatch" data-color="0xd7e8c3" style="background:#d7e8c3" aria-label="抹茶"></button>
    <button class="swatch" data-color="0xf9e3ae" style="background:#f9e3ae" aria-label="蛋黄"></button>
  </div>
  <div class="row">
    <button id="btnReset" class="primary">新的一块（重置）</button>
    <button id="btnSpin">转一转</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- 场景 ----------
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3efe9);
scene.fog = new THREE.Fog(0xf3efe9, 11, 19);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 50);
let camAngle = 0.55, camTilt = 0.42, spinVel = 0;
function placeCamera() {
  camera.position.set(Math.sin(camAngle) * 6.7, Math.sin(camTilt) * 6.7 + 0.4, Math.cos(camAngle) * 6.7);
  camera.lookAt(0, -0.05, 0);
}
placeCamera();

scene.add(new THREE.HemisphereLight(0xffffff, 0xcfc4b4, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(3, 5, 2.5); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffe9d6, 0.55);
fill.position.set(-4, 2, -3); scene.add(fill);

const ground = new THREE.Mesh(new THREE.CircleGeometry(3.6, 48), new THREE.ShadowMaterial({ opacity: 0.15 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -1.06; ground.receiveShadow = true;
scene.add(ground);
const disc = new THREE.Mesh(new THREE.CircleGeometry(1.75, 48), new THREE.MeshStandardMaterial({ color: 0xe9e1d3, roughness: 0.95 }));
disc.rotation.x = -Math.PI / 2; disc.position.y = -1.05; disc.receiveShadow = true;
scene.add(disc);

// ---------- 造型：超椭球（方块 q=4 / 圆球 q=2），统一隐式面 ----------
const SHAPES = {
  block: { a: 1.14, b: 0.76, c: 1.14, q: 4 },
  ball:  { a: 1.02, b: 1.02, c: 1.02, q: 2 }
};
let shape = SHAPES.block, shapeName = 'block';
function shapeG(x, y, z) { // 隐式函数值，表面 =1
  const s = shape;
  return Math.pow(Math.abs(x) / s.a, s.q) + Math.pow(Math.abs(y) / s.b, s.q) + Math.pow(Math.abs(z) / s.c, s.q);
}
function surfPoint(dir, out) { // 沿方向 dir 到表面的点
  const s = shape;
  const g = Math.pow(Math.abs(dir.x) / s.a, s.q) + Math.pow(Math.abs(dir.y) / s.b, s.q) + Math.pow(Math.abs(dir.z) / s.c, s.q);
  const r = Math.pow(g, -1 / s.q);
  out.set(dir.x * r, dir.y * r, dir.z * r);
  return out;
}
function surfNormal(p, out) { // 隐式面梯度
  const s = shape, q = s.q;
  out.set(
    q * Math.pow(Math.abs(p.x), q - 1) * Math.sign(p.x) / Math.pow(s.a, q),
    q * Math.pow(Math.abs(p.y), q - 1) * Math.sign(p.y) / Math.pow(s.b, q),
    q * Math.pow(Math.abs(p.z), q - 1) * Math.sign(p.z) / Math.pow(s.c, q)
  );
  return out.normalize();
}
function buildSurfaceGeometry() {
  const g = new THREE.SphereGeometry(1, 64, 44);
  const pos = g.attributes.position;
  const v = new THREE.Vector3(), d = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    d.copy(v).normalize();
    surfPoint(d, v);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}
const ballMat = new THREE.MeshPhysicalMaterial({
  color: 0xf6f1e7, roughness: 0.38, transmission: 0.5, thickness: 1.5,
  ior: 1.35, clearcoat: 0.4, clearcoatRoughness: 0.5, sheen: 0.3, sheenColor: 0xffffff
});
let surfGeo = buildSurfaceGeometry();
const ball = new THREE.Mesh(surfGeo, ballMat);
ball.castShadow = true;
scene.add(ball);
let surfRest = new Float32Array(surfGeo.attributes.position.array);
let surfCount = surfGeo.attributes.position.count;

// ---------- 内部粒子笼（沿用 v0.3 内核，按造型重建） ----------
let NP = 0, pRest, pPos, pVel, pSlow, springs = [];
function buildCage() {
  const pts = [], step = 0.36, s = shape;
  for (let x = -s.a; x <= s.a + 0.001; x += step)
    for (let y = -s.b; y <= s.b + 0.001; y += step)
      for (let z = -s.c; z <= s.c + 0.001; z += step)
        if (shapeG(x, y, z) <= 0.78) pts.push([x, y, z]);
  NP = pts.length;
  pRest = new Float32Array(NP * 3); pPos = new Float32Array(NP * 3);
  pVel = new Float32Array(NP * 3); pSlow = new Float32Array(NP * 3);
  for (let i = 0; i < NP; i++) { pRest.set(pts[i], i * 3); pPos.set(pts[i], i * 3); pSlow.set(pts[i], i * 3); }
  springs = [];
  for (let i = 0; i < NP; i++) for (let j = i + 1; j < NP; j++) {
    const dx = pRest[i*3] - pRest[j*3], dy = pRest[i*3+1] - pRest[j*3+1], dz = pRest[i*3+2] - pRest[j*3+2];
    const d = Math.hypot(dx, dy, dz);
    if (d <= 0.60 && d > 0.001) springs.push([i, j, d]);
  }
}
buildCage();
function resetCage() { pPos.set(pRest); pSlow.set(pRest); pVel.fill(0); }
const _out = { x: 0, y: 0, z: 0 };
function dispAt(x, y, z, out) {
  let wx = 0, wy = 0, wz = 0, wsum = 0;
  for (let i = 0; i < NP; i++) {
    const ix = i * 3;
    const dx = x - pRest[ix], dy = y - pRest[ix+1], dz = z - pRest[ix+2];
    const d2 = dx*dx + dy*dy + dz*dz + 0.02;
    const w = 1 / (d2 * d2);
    wx += (pPos[ix] - pRest[ix]) * w; wy += (pPos[ix+1] - pRest[ix+1]) * w; wz += (pPos[ix+2] - pRest[ix+2]) * w;
    wsum += w;
  }
  out.x = wx / wsum; out.y = wy / wsum; out.z = wz / wsum;
  return out;
}
// 脆皮参数：形变退居其次——浅、硬；慢状态让压痕残留（不回原形）
const PHYS = { kSpring: 250, kAnchor: 42, damp: 3.4, slowMix: 0.5, tauIn: 0.2, tauOut: 30, kPress: 430 };

// ---------- 声音 ----------
let AC = null, lastCrackle = 0;
function audio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function noiseBuffer(ac, dur) {
  const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function playSquish(strength) {
  try {
    const ac = audio(), t = ac.currentTime;
    const src = ac.createBufferSource(); src.buffer = noiseBuffer(ac, 0.14);
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
    const g = ac.createGain(); g.gain.setValueAtTime(0.05 * strength, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    src.connect(f).connect(g).connect(ac.destination); src.start(t); src.stop(t + 0.15);
  } catch (e) {}
}
function playCrackle(big) { // 裂纹生长的脆响：主角音效
  const now = performance.now(); if (now - lastCrackle < (big ? 30 : 65)) return; lastCrackle = now;
  try {
    const ac = audio(), t0 = ac.currentTime;
    const bursts = big ? 6 : 2;
    for (let i = 0; i < bursts; i++) {
      const t = t0 + i * (0.02 + Math.random() * 0.025);
      const src = ac.createBufferSource(); src.buffer = noiseBuffer(ac, 0.05);
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900 + Math.random() * 2300; f.Q.value = 1.2;
      const g = ac.createGain(); const peak = (big ? 0.20 : 0.11) * (0.7 + Math.random() * 0.5);
      g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      src.connect(f).connect(g).connect(ac.destination); src.start(t); src.stop(t + 0.07);
    }
  } catch (e) {}
}

// ---------- 裂纹系统（v0.4 主角） ----------
const MAXSEG = 1600;
const crackPos = new Float32Array(MAXSEG * 2 * 3);
const crackGeo = new THREE.BufferGeometry();
crackGeo.setAttribute('position', new THREE.BufferAttribute(crackPos, 3));
crackGeo.setDrawRange(0, 0);
const cracks = new THREE.LineSegments(crackGeo, new THREE.LineBasicMaterial({ color: 0x4a3b2c, transparent: true, opacity: 0.95 }));
cracks.frustumCulled = false;
scene.add(cracks);
let crackNodes = [];   // {p:Vector3(静止表面点), h:Vector3(切向走向)}
let crackSegs = [];     // [ia, ib] 节点索引对
let crackCenters = [];  // 裂过的区域中心（变软用）
const _sv = new THREE.Vector3(), _sv2 = new THREE.Vector3(), _sv3 = new THREE.Vector3();
function addNode(p, h) { crackNodes.push({ p: p.clone(), h: h.clone() }); return crackNodes.length - 1; }
function addSeg(a, b) { if (crackSegs.length < MAXSEG) crackSegs.push([a, b]); }
function seedCrack(centerDir) {
  surfPoint(centerDir, _sv);
  surfNormal(_sv, _sv2);
  // 随机切向基
  _sv3.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).cross(_sv2).normalize();
  const center = addNode(_sv, _sv3);
  const arms = 5 + (Math.random() * 3 | 0);
  for (let k = 0; k < arms; k++) {
    const ang = (k / arms) * Math.PI * 2 + Math.random() * 0.5;
    const h = _sv3.clone().applyAxisAngle(_sv2, ang);
    let prev = center, from = _sv;
    const steps = 3 + (Math.random() * 3 | 0);
    for (let sIdx = 0; sIdx < steps; sIdx++) {
      _sv.copy(from).addScaledVector(h, 0.09 + Math.random() * 0.07).normalize();
      surfPoint(_sv, _sv2);
      const ni = addNode(_sv2, h);
      addSeg(prev, ni); prev = ni; from = _sv2.clone();
    }
  }
  crackCenters.push(_sv.clone());
  if (crackCenters.length > 48) crackCenters.shift();
  playCrackle(true);
}
function growCrack(centerDir) {
  // 从按压点附近的已有节点继续往外爬
  surfPoint(centerDir, _sv);
  const near = [];
  for (let i = 0; i < crackNodes.length; i++) if (crackNodes[i].p.distanceTo(_sv) < 1.15) near.push(i);
  if (!near.length) return 0;
  const ni = near[(Math.random() * near.length) | 0];
  const node = crackNodes[ni];
  surfNormal(node.p, _sv2);
  const turn = (Math.random() - 0.5) * 1.1;
  const h = node.h.clone().applyAxisAngle(_sv2, turn);
  // 向外漂移：裂纹从按压中心放射着爬，而不是原地打转
  _sv3.copy(node.p).sub(_sv).addScaledVector(_sv2, -node.p.clone().sub(_sv).dot(_sv2));
  if (_sv3.lengthSq() > 0.0001) { _sv3.normalize(); h.lerp(_sv3, 0.38).normalize(); }
  _sv3.copy(node.p).addScaledVector(h, 0.085 + Math.random() * 0.075).normalize();
  surfPoint(_sv3, _sv);
  const ci = addNode(_sv, h);
  addSeg(ni, ci);
  let added = 1;
  if (Math.random() < 0.20) { // 分叉
    const h2 = node.h.clone().applyAxisAngle(_sv2, (Math.random() < 0.5 ? 1 : -1) * (0.6 + Math.random() * 0.5));
    _sv3.copy(node.p).addScaledVector(h2, 0.08 + Math.random() * 0.06).normalize();
    surfPoint(_sv3, _sv);
    const bi = addNode(_sv, h2);
    addSeg(ni, bi); added++;
  }
  if (crackNodes.length % 14 === 0) { crackCenters.push(node.p.clone()); if (crackCenters.length > 48) crackCenters.shift(); }
  return added;
}
function crackSoftAt(x, y, z) { // 裂过的区域变软：0..1
  let s = 0;
  for (const c of crackCenters) {
    const dx = x - c.x, dy = y - c.y, dz = z - c.z;
    s += Math.exp(-(dx*dx + dy*dy + dz*dz) / 0.085);
  }
  return Math.min(1, s);
}
function clearCracks() { crackNodes = []; crackSegs = []; crackCenters = []; crackGeo.setDrawRange(0, 0); crackStatus(); }
function crackStatus() { document.getElementById('mCrack').textContent = crackSegs.length + ' 条'; }
const _cv = { x: 0, y: 0, z: 0 }, _cn = new THREE.Vector3();
function updateCrackLines() { // 裂纹贴在表面上、随形变走
  const pos = crackGeo.attributes.position.array;
  for (let sIdx = 0; sIdx < crackSegs.length; sIdx++) {
    for (let e = 0; e < 2; e++) {
      const node = crackNodes[crackSegs[sIdx][e]];
      dispAt(node.p.x, node.p.y, node.p.z, _cv);
      surfNormal(node.p, _cn);
      const o = (sIdx * 2 + e) * 3;
      pos[o] = node.p.x + _cv.x + _cn.x * 0.007;
      pos[o+1] = node.p.y + _cv.y + _cn.y * 0.007;
      pos[o+2] = node.p.z + _cv.z + _cn.z * 0.007;
    }
  }
  crackGeo.setDrawRange(0, crackSegs.length * 2);
  crackGeo.attributes.position.needsUpdate = true;
}

// ---------- 按压交互 ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pressing = false, pressHold = 0, pressDir = new THREE.Vector3(0, 1, 0);
let lastHitDir = new THREE.Vector3(0, 1, 0), draggingBg = false, lastX = 0;
let dispMagNow = 0, prevDispMag = 0, crackBudget = 0;

function castBall(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObject(ball, false)[0] || null;
}
renderer.domElement.addEventListener('pointerdown', e => {
  audio();
  const hit = castBall(e);
  renderer.domElement.setPointerCapture(e.pointerId);
  if (hit) { pressing = true; pressDir.copy(hit.point).normalize(); lastHitDir.copy(pressDir); }
  else { draggingBg = true; lastX = e.clientX; }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (pressing) {
    const hit = castBall(e);
    if (hit) { pressDir.copy(hit.point).normalize(); lastHitDir.copy(pressDir); }
  } else if (draggingBg) {
    camAngle += (e.clientX - lastX) * 0.008; lastX = e.clientX; placeCamera();
  }
});
function endPress() { pressing = false; draggingBg = false; }
renderer.domElement.addEventListener('pointerup', endPress);
renderer.domElement.addEventListener('pointercancel', endPress);

// ---------- 物理步进（固定 120Hz，沿用 v0.3） ----------
const force = new Float32Array(4096 * 3);
function physStep(h) {
  if (pressing) pressHold += h; else pressHold = Math.max(0, pressHold - h * 3);
  const depthBase = Math.min(0.40, 0.13 + pressHold * 0.38);
  const radius = Math.min(0.85, 0.42 + pressHold * 0.24);
  const sigma2 = 2 * Math.pow(radius * 0.55, 2);
  surfPoint(pressDir, _sv);
  const px = _sv.x, py = _sv.y, pz = _sv.z;

  force.fill(0, 0, NP * 3);
  for (let s = 0; s < springs.length; s++) {
    const i = springs[s][0], j = springs[s][1], rl = springs[s][2];
    const ix = i * 3, jx = j * 3;
    const dx = pPos[jx] - pPos[ix], dy = pPos[jx+1] - pPos[ix+1], dz = pPos[jx+2] - pPos[ix+2];
    const len = Math.hypot(dx, dy, dz) || 0.0001;
    const f = PHYS.kSpring * (len - rl) / len;
    force[ix] += dx * f; force[ix+1] += dy * f; force[ix+2] += dz * f;
    force[jx] -= dx * f; force[jx+1] -= dy * f; force[jx+2] -= dz * f;
  }
  const tau = pressing ? PHYS.tauIn : PHYS.tauOut;
  const slowRate = 1 - Math.exp(-h / tau);
  const dampF = Math.exp(-PHYS.damp * h);
  for (let i = 0; i < NP; i++) {
    const ix = i * 3;
    pSlow[ix] += (pPos[ix] - pSlow[ix]) * slowRate;
    pSlow[ix+1] += (pPos[ix+1] - pSlow[ix+1]) * slowRate;
    pSlow[ix+2] += (pPos[ix+2] - pSlow[ix+2]) * slowRate;
    const tx = pRest[ix] * (1 - PHYS.slowMix) + pSlow[ix] * PHYS.slowMix;
    const ty = pRest[ix+1] * (1 - PHYS.slowMix) + pSlow[ix+1] * PHYS.slowMix;
    const tz = pRest[ix+2] * (1 - PHYS.slowMix) + pSlow[ix+2] * PHYS.slowMix;
    let fx = force[ix] + (tx - pPos[ix]) * PHYS.kAnchor;
    let fy = force[ix+1] + (ty - pPos[ix+1]) * PHYS.kAnchor;
    let fz = force[ix+2] + (tz - pPos[ix+2]) * PHYS.kAnchor;
    if (pressing) {
      const dx = pRest[ix] - px, dy = pRest[ix+1] - py, dz = pRest[ix+2] - pz;
      const fall = Math.exp(-(dx*dx + dy*dy + dz*dz) / sigma2);
      if (fall > 0.02) {
        // 裂过的地方更软：压得更深
        const soft = crackSoftAt(pRest[ix], pRest[ix+1], pRest[ix+2]);
        const depth = depthBase * (1 + 0.65 * soft);
        fx += (pRest[ix] - pressDir.x * depth - pPos[ix]) * PHYS.kPress * fall;
        fy += (pRest[ix+1] - pressDir.y * depth - pPos[ix+1]) * PHYS.kPress * fall;
        fz += (pRest[ix+2] - pressDir.z * depth - pPos[ix+2]) * PHYS.kPress * fall;
      }
    }
    pVel[ix] = (pVel[ix] + fx * h) * dampF;
    pVel[ix+1] = (pVel[ix+1] + fy * h) * dampF;
    pVel[ix+2] = (pVel[ix+2] + fz * h) * dampF;
    const sp = Math.hypot(pVel[ix], pVel[ix+1], pVel[ix+2]);
    if (sp > 7) { const c = 7 / sp; pVel[ix] *= c; pVel[ix+1] *= c; pVel[ix+2] *= c; }
    pPos[ix] += pVel[ix] * h; pPos[ix+1] += pVel[ix+1] * h; pPos[ix+2] += pVel[ix+2] * h;
    const ox = pPos[ix] - pRest[ix], oy = pPos[ix+1] - pRest[ix+1], oz = pPos[ix+2] - pRest[ix+2];
    const om = Math.hypot(ox, oy, oz);
    if (om > 0.85) { const c = 0.85 / om; pPos[ix] = pRest[ix] + ox * c; pPos[ix+1] = pRest[ix+1] + oy * c; pPos[ix+2] = pRest[ix+2] + oz * c; }
  }
}

// ---------- 每帧：表面/裂纹跟随 + 裂纹生长 ----------
const _v = { x: 0, y: 0, z: 0 };
function updateSurfaces(dt) {
  const posAttr = surfGeo.attributes.position;
  for (let i = 0; i < surfCount; i++) {
    const ix = i * 3;
    dispAt(surfRest[ix], surfRest[ix+1], surfRest[ix+2], _v);
    posAttr.array[ix] = surfRest[ix] + _v.x;
    posAttr.array[ix+1] = surfRest[ix+1] + _v.y;
    posAttr.array[ix+2] = surfRest[ix+2] + _v.z;
  }
  posAttr.needsUpdate = true;
  surfGeo.computeVertexNormals();

  surfPoint(pressDir, _sv);
  dispAt(_sv.x, _sv.y, _sv.z, _v);
  prevDispMag = dispMagNow;
  dispMagNow = Math.hypot(_v.x, _v.y, _v.z);
  document.getElementById('mDepth').textContent = Math.round(Math.min(1, dispMagNow / 0.5) * 100) + '%';
  if (pressing && dispMagNow > prevDispMag + 0.006) playSquish(Math.min(1, dispMagNow * 1.4));

  // 裂纹生长：压得越深长得越快；新落点先开一朵裂纹星
  if (pressing && dispMagNow > 0.055 && crackSegs.length < MAXSEG) {
    crackBudget += dt * (40 + dispMagNow * 300);
    let nearNodes = 0;
    surfPoint(pressDir, _sv);
    for (let i = Math.max(0, crackNodes.length - 400); i < crackNodes.length; i++)
      if (crackNodes[i].p.distanceTo(_sv) < 0.3) { nearNodes++; break; }
    if (!nearNodes && crackBudget > 5) { seedCrack(pressDir); crackBudget -= 5; crackStatus(); }
    let grew = 0;
    while (crackBudget >= 1) {
      const n = growCrack(pressDir);
      if (!n) { crackBudget = 0; break; }
      grew += n; crackBudget -= 1;
      if (grew > 14) break;
    }
    if (grew) { playCrackle(false); crackStatus(); }
  } else crackBudget = Math.max(0, crackBudget - dt * 20);

  if (crackSegs.length) updateCrackLines();
  if (Math.abs(spinVel) > 0.001) { camAngle += spinVel * dt; spinVel *= Math.pow(0.25, dt); placeCamera(); }
}

// ---------- UI ----------
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1700);
}
function switchShape(name) {
  shapeName = name; shape = SHAPES[name];
  const old = surfGeo;
  surfGeo = buildSurfaceGeometry();
  ball.geometry = surfGeo;
  surfRest = new Float32Array(surfGeo.attributes.position.array);
  surfCount = surfGeo.attributes.position.count;
  old.dispose();
  buildCage(); clearCracks();
  ground.position.y = disc.position.y - 0.01;
  const bottom = -shape.b - 0.30;
  disc.position.y = bottom; ground.position.y = bottom - 0.01;
}
document.querySelectorAll('[data-shape]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-shape]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); switchShape(b.dataset.shape);
  toast(b.dataset.shape === 'block' ? '方块：照着原版视频同款' : '圆球：换个造型裂着玩');
}));
document.querySelectorAll('[data-color]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-color]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); ballMat.color.setHex(parseInt(b.dataset.color));
}));
document.getElementById('btnReset').addEventListener('click', () => {
  resetCage(); clearCracks(); toast('新的一块，完好无裂');
});
document.getElementById('btnSpin').addEventListener('click', () => { spinVel = 5; });
disc.position.y = -shape.b - 0.30; ground.position.y = disc.position.y - 0.01;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- 主循环 ----------
const clock = new THREE.Clock();
let acc = 0;
const H = 1 / 120;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.06);
  acc += dt;
  let steps = 0;
  while (acc >= H && steps < 10) { physStep(H); acc -= H; steps++; }
  if (steps === 10) acc = 0;
  updateSurfaces(dt);
  renderer.render(scene, camera);
}
loop();
crackStatus();
console.log('shape:', shapeName, 'cage particles:', NP, 'springs:', springs.length);
window.__squishy = { get segs(){ return crackSegs.length; }, get disp(){ return dispMagNow; }, softAtPress: () => { surfPoint(pressDir, _sv); return crackSoftAt(_sv.x, _sv.y, _sv.z); } };
</script>
